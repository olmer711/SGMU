<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f1ec">
  <title>Цикл Кребса — интерактивная схема</title>
  <style>
    :root {
      --ink: #171915;
      --muted: #6a6d65;
      --paper: #fff;
      --page: #efeee9;
      --metabolite: #008a65;
      --enzyme: #b05a24;
      --factor: #316da5;
      --reaction: #7357a6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(145deg, #f8f7f3, var(--page));
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin: 0 2px 16px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(27px, 5vw, 42px);
      font-weight: 600;
      letter-spacing: -.025em;
    }

    .hint {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .clear {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 8px 13px;
      border: 1px solid #d4d2cb;
      border-radius: 999px;
      color: #4e514a;
      background: rgba(255,255,255,.78);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .clear:hover { background: #fff; }

    .clear:disabled {
      opacity: .45;
      cursor: default;
    }

    .learning-layout {
      display: grid;
      grid-template-columns: minmax(0, 750px) minmax(300px, 1fr);
      gap: 20px;
      align-items: start;
    }

    .sheet {
      overflow: hidden;
      border: 1px solid #d9d7d0;
      border-radius: 20px;
      background: var(--paper);
      box-shadow: 0 18px 56px rgba(35, 34, 29, .12);
    }

    .diagram {
      position: relative;
      width: 100%;
      aspect-ratio: 750 / 758;
      background: #fff;
      isolation: isolate;
    }

    .diagram svg {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .diagram svg {
      z-index: 1;
      touch-action: manipulation;
      user-select: none;
    }

    .source-image { pointer-events: none; }

    .hotspot {
      color: var(--metabolite);
      cursor: pointer;
      outline: none;
    }

    .hotspot.enzyme { color: var(--enzyme); }
    .hotspot.factor { color: var(--factor); }
    .hotspot.reaction { color: var(--reaction); }

    .hit-shape {
      fill: transparent;
      stroke: transparent;
      stroke-width: 2.5;
      vector-effect: non-scaling-stroke;
      transition: fill .14s ease, stroke .14s ease;
    }

    .reaction .hit-shape {
      fill: none;
      stroke: transparent;
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: stroke;
    }

    .hotspot:hover .hit-shape,
    .hotspot:focus-visible .hit-shape,
    .hotspot.is-selected .hit-shape {
      fill: color-mix(in srgb, currentColor 13%, transparent);
      stroke: currentColor;
    }

    .reaction:hover .hit-shape,
    .reaction:focus-visible .hit-shape,
    .reaction.is-selected .hit-shape {
      fill: none;
      stroke: color-mix(in srgb, currentColor 72%, transparent);
      stroke-width: 10;
    }

    .info-panel {
      position: sticky;
      top: 24px;
      min-height: 260px;
      border: 1px solid #d9d7d0;
      border-radius: 20px;
      color: var(--ink);
      background: #fff;
      box-shadow: 0 18px 56px rgba(35, 34, 29, .10);
    }

    .info-card { padding: 24px 26px 26px; }

    .info-head {
      margin-bottom: 12px;
    }

    .info-kind {
      margin: 0 0 4px;
      color: var(--info-color, var(--metabolite));
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .info-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(25px, 5vw, 34px);
      line-height: 1.08;
      letter-spacing: -.02em;
      hyphens: auto;
      overflow-wrap: anywhere;
    }

    .info-text {
      margin: 0;
      color: #343730;
      font-size: 16px;
      line-height: 1.62;
    }

    .info-panel.is-empty .info-kind { color: var(--muted); }
    .info-panel.is-empty .info-title { color: #5c6058; }
    .info-text { white-space: pre-line; }

    body.debug .hit-shape {
      fill: color-mix(in srgb, currentColor 16%, transparent);
      stroke: currentColor;
    }

    body.debug .reaction .hit-shape {
      fill: none;
      stroke: color-mix(in srgb, currentColor 72%, transparent);
      stroke-width: 8;
    }

    @media (max-width: 1120px) {
      .page { width: min(800px, 100%); }
      .learning-layout { grid-template-columns: 1fr; }
      .info-panel { position: static; min-height: 0; }
    }

    @media (max-width: 580px) {
      .page { padding: 10px; }
      .topbar { align-items: center; margin: 4px 2px 11px; }
      .hint { display: none; }
      .sheet { border-radius: 14px; }
      .clear { min-height: 38px; padding-inline: 11px; }
      .info-panel { border-radius: 14px; }
      .info-card { padding: 18px 18px 17px; }
      .info-text { font-size: 15px; line-height: 1.55; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hit-shape { transition: none; }
    }
  </style>
</head>

    const INFO = Object.freeze({
      "acetyl-coa": "Ацетил-SКоА — это активированная форма уксусной кислоты и один из центральных метаболитов клетки. Он образуется главным образом при окислительном декарбоксилировании пирувата, а также при β-окислении жирных кислот и распаде некоторых аминокислот. Его основная роль в цикле Кребса — принести двухуглеродный ацетильный остаток, который соединяется с оксалоацетатом с образованием цитрата. Коэнзим А при этом служит переносчиком ацильных групп и после реакции высвобождается в виде HS-КоА.",
      "oxaloacetate": "Оксалоацетат, он же Цавеле-Уксусная Кислота, ЩУК — четырёхуглеродная кетокислота, которая принимает двухуглеродный ацетильный остаток от ацетил-SКоА. В начале цикла из оксалоацетата и ацетил-SКоА образуется цитрат, а в последней реакции оксалоацетат восстанавливается из малата. Поэтому он работает как постоянно регенерируемый акцептор и в норме не расходуется. При необходимости его запас пополняется, например, карбоксилированием пирувата.",
      "reaction-1": "Реакция С-С конденсации.\nОксалоацетат + ацетил-SКоА + H₂O → цитрат + HS-КоА. \nДвухуглеродный ацетильный остаток присоединяется к четырёхуглеродному оксалоацетату, поэтому получается шестиуглеродный цитрат. Гидролиз тиоэфирной связи делает реакцию практически необратимой и вводит ацетильный остаток в цикл.",
      "citrate-synthase": "Цитратсинтаза. очень важный фермент, является одним из регулирующих . Фермент матрикса митохондрий, который катализирует первую реакцию цикла: соединяет оксалоацетат с ацетильным остатком ацетил-SКоА (\"ЩУКа съела ацетат\"). \n\nИНГИБИТОРЫ фермента: АТФ, НАДН, Цитрат, HS-KoA. Классическая отрицательная обратная связь за счет продуктов (в том числе последующих реакций)",
      "water-citrate-synthase": "Вода в этой реакции — обычная вода митохондриального матрикса, она не образуется специально для цикла Кребса. ",
      "coa-product-citrate-synthase": "HS-КоА — свободный коэнзим А, который высвобождается после гидролиза цитрил-SКоА. В этой реакции он уже отдал ацетильный остаток, принесённый ацетил-SКоА. Освободившийся HS-КоА не разрушается: он снова может переносить ацильные группы, например участвовать в образовании ацетил-SКоА или сукцинил-SКоА.",
      "citrate": "Цитрат — шестиуглеродный трикарбоксилат и первый устойчивый продукт цикла Кребса. При ингибированной изоцитратдегидрогеназе накопившийся цитрат может выходить из матрикса митохондрий в цитозоль, где служит источником ацетил-SКоА для синтеза жирных кислот и холестерина. Это механизм набора веса при избыточном поступлении энергии.",
      "reaction-2": "Цитрат ⇄ изоцитрат. У цитрата группа OH присоединена к атому углерода, у которого нет водорода. Поэтому окислить эту группу до кетонной (=O) обычным способом невозможно: для этого нужно удалить водород и от группы OH, и от самого атома углерода. Аконитаза решает эту проблему: сначала отщепляет воду, а затем присоединяет её обратно так, чтобы группа OH оказалась на соседнем атоме углерода, где водород есть. Теперь молекула готова к окислению на следующем этапе цикла Кребса.",
      "aconitase": "Аконитаза — железосерный фермент, который обратимо превращает цитрат в изоцитрат через промежуточный цис-аконитат. Сначала вода отщепляется, затем присоединяется обратно в другом положении. В результате гидроксильная группа перемещается на соседний атом углерода, подготавливая молекулу к окислению.",
      "isocitrate": "Изоцитрат — изомер цитрата, который образуется при переносе гидроксильной группы в реакции аконитазы. Такая перестройка делает молекулу пригодной для последующего окисления. Изоцитрат окисляется и декарбоксилируется до α-кетоглутарата; при этом образуются НАДН + H⁺ и CO₂.",
      "reaction-3": "Окислительное декарбоксилирование Изоцитрата.\n\nИзоцитрат + НАД⁺ → α-кетоглутарат + CO₂ + НАДН + H⁺. \n\nШестиуглеродный изоцитрат сначала окисляется, затем теряет один атом углерода в виде CO₂. Реакция практически необратима и даёт первую молекулу НАДН.",
      "isocitrate-dehydrogenase": "Изоцитратдегидрогеназа - САМЫЙ ГЛАВНЫЙ фермент цикла Кребса. Это скорость-регулирующий фермент и именно он определяет, насколько быстро будет идти весь цикл.\nКатализирует окислительное декарбоксилирование изоцитрата до α-кетоглутарата. \n\nИНГИБИТОРЫ фермента: АТФ, НАДН, Классическая отрицательная обратная связь за счет продуктов (в том числе последующих реакций)\n\nАКТИВАТОР фермента: АМФ, АДФ, которые являются продуктами расходования АТФ.\n\nМного АМФ и АДФ - значит энергия (АТФ) - была потрачена - ускоряем цикл.",
      "nad-isocitrate-dehydrogenase": "НАД⁺ в реакции изоцитратдегидрогеназы служит акцептором электронов и водорода. Он принимает гидрид-ион (водород с двумя электронами) от изоцитрата и восстанавливается до НАДН.\nНАД⁺ синтезируется из витамина PP — ниацина — и после отдачи электронов дыхательной цепи регенерируется из НАДН.",
      "nadh-isocitrate-dehydrogenase": "НАДН переносит высокоэнергетические электроны к комплексу I дыхательной цепи, где их энергия используется для создания протонного градиента и синтеза АТФ. Сам НАДН затем снова превращается в НАД⁺.\n\nЭТО ПЕРВЫЙ ИЗ ТРЕХ НАДН, ОБРАЗУЮЩИХСЯ В ЦИКЛЕ.\n\nПротон H⁺ присоединяется к нестабильному оксалосукцинату (промежуточный этап изоцитрат-дегидрогеназной реакции) после его декарбоксилирования и превращает его в α-Кетоглутарат.",
      "co2-isocitrate-dehydrogenase": "CO₂ выделяется при декарбоксилировании промежуточного продукта реакции изоцитратдегидрогеназы. Это первая из двух молекул углекислого газа, образующихся за один оборот цикла. ",
      "alpha-ketoglutarate": "α-Кетоглутарат — пятиуглеродная α-кетокислота, образующаяся из изоцитрата после первой окислительной декарбоксилирующей реакции цикла. Анион глутаровой кислоты\n\nα-Кетоглутарат также связывает цикл Кребса с обменом аминокислот, поскольку легко превращается в глутамат и образуется из него.",
      "reaction-4": "Окислительное декарбоксилирование α-кетоглутарата.\n\nα-Кетоглутарат + HS-КоА + НАД⁺ → сукцинил-SКоА + CO₂ + НАДН + H⁺. Пятиуглеродная молекула теряет CO₂, окисляется, а оставшийся четырёхуглеродный сукцинильный остаток связывается с коэнзимом А. Реакция необратима и сохраняет часть энергии в НАДН и тиоэфирной связи.",
      "alpha-ketoglutarate-dehydrogenase": "α-Кетоглутаратдегидрогеназа. Последний важный регулирующий фермент в цикле. Вернее, это многоферментный комплекс, сходный по устройству с пируватдегидрогеназным.\n\nИНГИБИТОРЫ фермента: Сукцинил-SКоА, НАДН. Классическая отрицательная обратная связь за счет продуктов (в том числе последующих реакций)",
      "nad-alpha-ketoglutarate-dehydrogenase": "НАД⁺ служит акцептором электронов и водорода. \nОн принимает гидрид-ион (водород с двумя электронами) от α-кетоглутарата и восстанавливается до НАДН. НАД⁺ синтезируется из витамина PP — ниацина — и после отдачи электронов дыхательной цепи регенерируется из НАДН.",
      "coa-alpha-ketoglutarate-dehydrogenase": "HS-КоА выступает реагентом и принимает образующийся сукцинильный остаток. Его тиольная группа образует с сукцинилом высокоэнергетическую тиоэфирную связь, поэтому продуктом становится сукцинил-SКоА. Эта связь сохраняет энергию окисления для следующей реакции — синтеза ГТФ.",
      "nadh-alpha-ketoglutarate-dehydrogenase": "НАДН  образуется на завершающем этапе работы α-кетоглутаратдегидрогеназного комплекса. Он уносит электроны, полученные при окислении α-кетоглутарата, к дыхательной цепи. \n\nЭТО ВТОРОЙ ИЗ ТРЕХ НАДН, ОБРАЗУЮЩИХСЯ В ЦИКЛЕ.\n\nПротон H⁺ уходит в среду.",

      "coa-product-succinyl-coa-synthetase": "HS-КоА освобождается при превращении сукцинил-SКоА в сукцинат и возвращается в общий митохондриальный пул. Энергия связи между сукцинильным остатком и коэнзимом А не рассеивается, а через фосфорилированные промежуточные соединения используется для образования ГТФ. ",
      "succinate": "Сукцинат — четырёхуглеродный дикарбоксилат, который образуется из сукцинил-SКоА при субстратном фосфорилировании. ",

      "reaction-7": "Гидратация фумарата.\n\nФумарат + H₂O ⇄ L-малат. Вода присоединяется по двойной связи: один атом углерода получает H, другой — OH. Реакция не является окислительно-восстановительной и идёт стереоспецифично, поэтому образуется именно L-малат.",
      "fumarase": "Фумараза, или фумаратгидратаза, обратимо и стереоспецифично присоединяет воду к двойной связи фумарата. В результате образуется только L-малат, а не случайная смесь изомеров. Митохондриальная фумараза работает в цикле Кребса, хотя фермент присутствует и в цитозоле.",

      "malate-dehydrogenase": "Малатдегидрогеназа катализирует обратимое окисление L-малата до оксалоацетата с восстановлением НАД⁺. В стандартных условиях равновесие невыгодно для образования оксалоацетата, но в матриксе продукт сразу забирает цитратсинтаза, поэтому реакция идёт вперёд. Так цикл получает новый оксалоацетат и ещё одну молекулу НАДН + H⁺.",
      "nad-nadh-malate-dehydrogenase": "В последней реакции цикла НАД⁺ принимает гидрид-ион (водород с двумя электронами) от малата.\n\nПротон H⁺ от малата уходит в среду."
});

    const overlay = document.querySelector('.diagram svg');
    const sourceImage = overlay.querySelector('.source-image');
    [...overlay.querySelectorAll('.reaction')]
      .reverse()
      .forEach(item => sourceImage.after(item));

    const hotspots = [...document.querySelectorAll('.hotspot')];
    const clearButton = document.querySelector('.clear');
    const infoPanel = document.querySelector('.info-panel');
    const infoKind = document.querySelector('.info-kind');
    const infoTitle = document.querySelector('.info-title');
    const infoText = document.querySelector('.info-text');

    hotspots.forEach(item => {
      const matrix = ZONE_TRANSFORMS[item.dataset.id];
      if (matrix) item.setAttribute('transform', `matrix(${matrix.join(' ')})`);
    });

    if (new URLSearchParams(location.search).has('debug')) {
      document.body.classList.add('debug');
    }

    function selectHotspot(target) {
      hotspots.forEach(item => item.classList.toggle('is-selected', item === target));

      if (!target) {
        clearButton.disabled = true;
        infoPanel.classList.add('is-empty');
        infoPanel.style.removeProperty('--info-color');
        infoKind.textContent = 'Справка';
        infoTitle.textContent = 'Выбери элемент';
        infoText.textContent = 'Нажми на вещество, фермент, кофермент или стрелку реакции — информация появится здесь.';
        return;
      }

      const color = getComputedStyle(target).color;
      clearButton.disabled = false;
      infoPanel.classList.remove('is-empty');
      infoPanel.style.setProperty('--info-color', color);
      infoKind.textContent = target.dataset.kind;
      infoTitle.textContent = target.dataset.title;
      infoText.textContent = INFO[target.dataset.id] || 'Справка для этого элемента пока не заполнена.';
    }

    hotspots.forEach(item => {
      item.addEventListener('click', event => {
        event.stopPropagation();
        selectHotspot(item.classList.contains('is-selected') ? null : item);
      });

      item.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          selectHotspot(item.classList.contains('is-selected') ? null : item);
        }
      });
    });

    document.querySelector('.diagram').addEventListener('click', () => selectHotspot(null));
    clearButton.addEventListener('click', () => selectHotspot(null));
    selectHotspot(null);
  </script>
</body>
</html>
