<head>
<meta charset="UTF-8">
<title>Тренажер</title>
<style>

h1 { text-align: center; }

.hidden { display: none; }

<body>
<h1>Тренажер по тестовым заданиям, матфиз, 1 курс</h1>
<div id="menu">

    <label>До: <input type="number" id="endIndex" min="1" placeholder="325"></label>
    <button type="submit">Начать</button>
  </form>

  <form id="randomForm" style="margin-top: 10px;">

    <button type="submit">Генерировать</button>
  </form>

  <p style="margin-top:10px;">Сделал Артем для групп 103 и 104 леч, 2025 год</p>
</div>

</div>

let currentIndex = 0;
const menu = document.getElementById('menu');
const quiz = document.getElementById('quiz');

const resultMessageEl = document.getElementById('resultMessage');

// Счётчики количества решённых вопросов и правильных ответов
let score = 0;
let answered = 0;

document.getElementById('rangeForm').addEventListener('submit', function(e){
    e.preventDefault();
    const start = parseInt(document.getElementById('startIndex').value) || 1;
    const end = parseInt(document.getElementById('endIndex').value) || questions.length;
    currentRange = questions.filter(q => q.id >= start && q.id <= end);
    if (currentRange.length === 0) {
        alert('Неверный диапазон.');
        return;
    }
    currentIndex = 0;
    startQuiz();
});

// Обработчик формы генерации случайного теста
document.getElementById('randomForm').addEventListener('submit', function(e){
    e.preventDefault();
    const count = parseInt(document.getElementById('randomCount').value);
    // Проверяем корректность введённого числа
    if (!count || count < 1 || count > questions.length) {
        alert('Введите корректное число от 1 до ' + questions.length);
        return;
    }
    // Создаём случайную выборку заданий без повторений
    const shuffled = questions.slice().sort(() => Math.random() - 0.5);
    currentRange = shuffled.slice(0, count);
    currentIndex = 0;
    startQuiz();
});

    // Перед началом нового теста сбрасываем счётчики и очищаем сообщение о результате
    score = 0;
    answered = 0;
    if (resultMessageEl) resultMessageEl.textContent = '';
    loadQuestion();
}

function loadQuestion(){
    feedbackEl.textContent = '';
    nextBtn.classList.add('hidden');
    checkBtn.disabled = false;
    const q = currentRange[currentIndex];
    questionTextEl.textContent = q.id + '. ' + q.question;
    optionsListEl.innerHTML = '';
    q.options.forEach((opt, idx) => {
        const li = document.createElement('li');
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.value = idx + 1;
        label.appendChild(input);
        // add number prefix
        if (typeof opt === 'string' && opt.startsWith('data:image')) {
            const span = document.createElement('span');
            span.textContent = ' ' + (idx + 1) + ') ';
            label.appendChild(span);
            const img = document.createElement('img');
            img.src = opt;
            img.style.maxHeight = '40px';
            img.style.verticalAlign = 'middle';
            label.appendChild(img);
        } else {
            label.appendChild(document.createTextNode(' ' + (idx + 1) + ') ' + opt));
        }
        li.appendChild(label);
        optionsListEl.appendChild(li);
    });
}

checkBtn.addEventListener('click', function(){
    const q = currentRange[currentIndex];
    const selected = Array.from(optionsListEl.querySelectorAll('input:checked')).map(el => parseInt(el.value));
    q.options.forEach((opt, idx) => {
        const li = optionsListEl.children[idx];
        const label = li.querySelector('label');
        if (q.correct.includes(idx + 1)) {
            label.classList.add('correct');
        }
    });
    let correctAns = false;
    if (selected.length === q.correct.length && selected.every(val => q.correct.includes(val))) {
        correctAns = true;
    }
    feedbackEl.textContent = correctAns ? 'Верно!' : 'Неверно! Правильные ответы: ' + q.correct.join(', ');
    // Учитываем ответ пользователя в статистике
    answered++;
    if (correctAns) {
        score++;
    }
    checkBtn.disabled = true;
    nextBtn.classList.remove('hidden');
});

nextBtn.addEventListener('click', function(){
    currentIndex++;
    if (currentIndex >= currentRange.length) {
        // Тест завершён: вычисляем процент правильных ответов и выводим результат
        const percent = answered > 0 ? Math.round((score / answered) * 100) : 0;
        if (resultMessageEl) {
            resultMessageEl.textContent = 'Результат: ' + score + ' из ' + answered + ' (' + percent + '%)';
        }
        feedbackEl.textContent = 'Тест завершён.';
        questionTextEl.textContent = '';
        optionsListEl.innerHTML = '';
        checkBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
        menu.classList.remove('hidden');
    } else {
        loadQuestion();
    }
});

exitBtn.addEventListener('click', function(){
    // При выходе из теста выводим промежуточный результат
    const percent = answered > 0 ? Math.round((score / answered) * 100) : 0;
    if (resultMessageEl) {
        resultMessageEl.textContent = 'Результат: ' + score + ' из ' + answered + ' (' + percent + '%)';
    }
    quiz.classList.add('hidden');
    menu.classList.remove('hidden');
    feedbackEl.textContent = '';
    questionTextEl.textContent = '';
    optionsListEl.innerHTML = '';
    checkBtn.classList.remove('hidden');
    nextBtn.classList.add('hidden');
});
</script>
</body>
</html>
